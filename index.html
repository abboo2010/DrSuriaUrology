<style>
:root{--bg1:#F6FBF8;--bg2:#E2F1EA;--surface:#fff;--ink:#0F2A24;--ink2:#48625A;--line:#CFE2D9;--field:#F3F8F5;--brand:#137A5C;--brand2:#1D5A4A;--err:#B3261E;--on-btn:#fff}
@media (prefers-color-scheme:dark){:root{--bg1:#0A1F1A;--bg2:#0D2A23;--surface:#10302A;--ink:#E8F6EF;--ink2:#9CC7B8;--line:#25564A;--field:#0C2823;--brand:#35D3A5;--brand2:#1FA37F;--err:#FF8A80;--on-btn:#07221B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.4rem;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(100%,600px);background:var(--surface);border:1px solid var(--line);border-radius:34px;padding:2.4rem 2.6rem 2.2rem;text-align:center;box-shadow:0 24px 60px rgba(13,51,41,.10)}
.logo{width:150px;height:150px;border-radius:50%;border:1px solid var(--line);object-fit:cover;background:#fff}
h1{font-size:1.9rem;line-height:1.15;margin:1.2rem 0 .8rem;letter-spacing:-.02em}
p.lead{margin:0 0 1.6rem;color:var(--ink2);font-size:1.05rem;line-height:1.6}
form{display:grid;gap:1rem;text-align:left}
label.t{display:block;font-size:.95rem;color:var(--ink2);margin-bottom:.4rem}
.fld{position:relative}
input.in{width:100%;font:inherit;font-size:1.05rem;padding:1rem 1.1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);height:3.6rem}
input.in:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.eye{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);width:2.6rem;height:2.6rem;display:grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:50%;padding:0}
.eye svg{width:24px;height:24px}
button.go{font:inherit;font-weight:700;font-size:1.1rem;height:3.6rem;border:0;border-radius:16px;background:linear-gradient(90deg,var(--brand),var(--brand2));color:var(--on-btn);cursor:pointer;margin-top:.4rem}
button.go:disabled{opacity:.65;cursor:wait}
label.rem{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--ink2)}
#err{min-height:1.3em;margin:0;font-size:.92rem;color:var(--err);text-align:center}
.foot{margin:1rem 0 0;font-size:.8rem;color:var(--ink2)}
noscript{display:block;color:var(--err);margin-top:1rem}
@media (max-width:480px){.card{padding:1.8rem 1.3rem 1.6rem;border-radius:26px}.logo{width:120px;height:120px}h1{font-size:1.6rem}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="images/logo.jpg" alt="Dr. Suriaraj Urology logo" width="150" height="150">
  <h1>Website preview</h1>
  <p class="lead">This site is private until Dr. Suriaraj approves it. Please sign in to continue.</p>
  <form id="f" autocomplete="off">
    <div><label class="t" for="un">Username</label>
      <div class="fld"><input class="in" id="un" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div></div>
    <div><label class="t" for="pw">Password</label>
      <div class="fld"><input class="in" id="pw" type="password" autocomplete="current-password" required style="padding-right:3.4rem">
        <button class="eye" id="eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <label class="rem"><input id="rem" type="checkbox" checked> Remember me on this device</label>
    <p id="err" role="alert"></p>
    <button class="go" id="go" type="submit">Sign in</button>
  </form>
  <noscript>JavaScript is needed to open this page.</noscript>
  <p class="foot">Prepared by Click 4 Tech Solutions PLT</p>
</main>
